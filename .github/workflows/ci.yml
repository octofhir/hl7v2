name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.98", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Format
        run: |
          cargo +${{ matrix.toolchain }} fmt --all -- --check
          cargo +${{ matrix.toolchain }} fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --no-default-features
      - name: Test optional transport
        run: cargo +${{ matrix.toolchain }} test --locked --all-features
      - name: Clippy
        run: |
          cargo +${{ matrix.toolchain }} clippy --locked --all-features --all-targets -- -D warnings
          cargo +${{ matrix.toolchain }} clippy --manifest-path fuzz/Cargo.toml --locked --bins -- -D warnings
      - name: Check default library
        run: cargo +${{ matrix.toolchain }} check --locked --no-default-features --lib

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: hl7v2
          POSTGRES_PASSWORD: hl7v2
          POSTGRES_DB: hl7v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hl7v2 -d hl7v2"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      HL7V2_TEST_DATABASE_URL: postgres://hl7v2:hl7v2@localhost:5432/hl7v2
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Apply schema to dedicated test database
        run: psql "$HL7V2_TEST_DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f migrations/0001_inbox.sql
      - name: Test durable custody and TCP retry
        run: cargo test --locked --all-features --test inbox -- --ignored --skip recovery_across_postgres_crash
      - name: Test insert-only custody role
        run: |
          psql "$HL7V2_TEST_DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -c "CREATE ROLE hl7v2_custody LOGIN PASSWORD 'custody'; GRANT USAGE ON SCHEMA hl7v2 TO hl7v2_custody; GRANT SELECT, INSERT ON ALL TABLES IN SCHEMA hl7v2 TO hl7v2_custody; GRANT USAGE ON ALL SEQUENCES IN SCHEMA hl7v2 TO hl7v2_custody;"
          HL7V2_TEST_DATABASE_URL=postgres://hl7v2_custody:custody@localhost:5432/hl7v2 cargo test --locked --all-features --test inbox concurrent_receipts_pin_one_original_plan_and_replay_after_reconnection -- --ignored
      - name: Commit recovery checkpoint
        run: HL7V2_RECOVERY_PHASE=seed cargo test --locked --all-features --test inbox recovery_across_postgres_crash -- --ignored
      - name: Crash and restart test database
        env:
          TEST_DATABASE_CONTAINER: ${{ job.services.database.id }}
        run: |
          docker kill --signal=KILL "$TEST_DATABASE_CONTAINER"
          docker start "$TEST_DATABASE_CONTAINER"
          timeout 30s bash -c 'until pg_isready -h localhost -U hl7v2 -d hl7v2; do sleep 1; done'
      - name: Verify recorded response after recovery
        run: HL7V2_RECOVERY_PHASE=verify cargo test --locked --all-features --test inbox recovery_across_postgres_crash -- --ignored

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-09-27 --profile minimal
          cargo +nightly-2026-09-27 install cargo-fuzz --version 0.13.2 --locked
      - name: Prepare synthetic seeds
        run: |
          cargo +nightly-2026-09-27 fetch --locked --manifest-path fuzz/Cargo.toml
          mkdir -p fuzz/corpus/wire fuzz/corpus/mllp
          cp tests/fixtures/*.er7 fuzz/corpus/wire/
          cp tests/fixtures/*.er7 fuzz/corpus/mllp/
      - name: Fuzz ER7, edits and ACKs
        run: cargo +nightly-2026-09-27 fuzz run wire -- -dict=fuzz/wire.dict -seed=701 -max_total_time=30 -max_len=4096 -rss_limit_mb=512 -timeout=5
      - name: Fuzz MLLP framing
        run: cargo +nightly-2026-09-27 fuzz run mllp -- -dict=fuzz/mllp.dict -seed=701 -max_total_time=30 -max_len=4096 -rss_limit_mb=512 -timeout=5
      - name: Retain failing synthetic inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore
