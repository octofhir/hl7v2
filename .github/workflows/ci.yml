name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.98", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Format
        run: |
          cargo +${{ matrix.toolchain }} fmt --all -- --check
          cargo +${{ matrix.toolchain }} fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --no-default-features
      - name: Test optional transport
        run: cargo +${{ matrix.toolchain }} test --locked --all-features
      - name: Clippy
        run: |
          cargo +${{ matrix.toolchain }} clippy --locked --all-features --all-targets -- -D warnings
          cargo +${{ matrix.toolchain }} clippy --manifest-path fuzz/Cargo.toml --locked --bins -- -D warnings
      - name: Check default library
        run: cargo +${{ matrix.toolchain }} check --locked --no-default-features --lib

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-09-27 --profile minimal
          cargo +nightly-2026-09-27 install cargo-fuzz --version 0.13.2 --locked
      - name: Prepare synthetic seeds
        run: |
          cargo +nightly-2026-09-27 fetch --locked --manifest-path fuzz/Cargo.toml
          mkdir -p fuzz/corpus/wire fuzz/corpus/mllp
          cp tests/fixtures/*.er7 fuzz/corpus/wire/
          cp tests/fixtures/*.er7 fuzz/corpus/mllp/
      - name: Fuzz ER7, edits and ACKs
        run: cargo +nightly-2026-09-27 fuzz run wire -- -dict=fuzz/wire.dict -seed=701 -max_total_time=30 -max_len=4096 -rss_limit_mb=512 -timeout=5
      - name: Fuzz MLLP framing
        run: cargo +nightly-2026-09-27 fuzz run mllp -- -dict=fuzz/mllp.dict -seed=701 -max_total_time=30 -max_len=4096 -rss_limit_mb=512 -timeout=5
      - name: Retain failing synthetic inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore
