[package]
name = "octofhir-hl7v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["OctoFHIR Team"]
license = "MIT OR Apache-2.0"
description = "Independent HL7 v2 wire tooling for OctoFHIR"
repository = "https://github.com/octofhir/hl7v2"
readme = "README.md"
keywords = ["hl7", "hl7v2", "er7", "healthcare"]
categories = ["parser-implementations"]

[lib]
name = "octofhir_hl7v2"

[features]
default = []
transport = ["dep:tokio"]
schema-package = ["dep:sha2"]
postgres = ["dep:sqlx", "dep:sha2"]

[dependencies]
tokio = { version = "1.54", optional = true, default-features = false, features = ["io-util", "net", "time", "rt", "sync", "macros"] }
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "postgres"] }
sha2 = { version = "0.11", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["rt", "macros", "test-util"] }

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "schema"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[bin]]
name = "hl7v2-validate"
path = "src/bin/validate.rs"
required-features = ["schema-package"]
